name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Release checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Linux keychain dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --lib --bins --tests --locked

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux keychain dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Configure reproducible build
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked -p cvx-cli

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          archive="cvx-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          mkdir -p dist
          cp target/release/cvx LICENSE-MIT LICENSE-APACHE README.md dist/
          tar -czf "$archive" -C dist cvx LICENSE-MIT LICENSE-APACHE README.md
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "cvx-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/cvx.exe, LICENSE-MIT, LICENSE-APACHE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File "$archive.sha256" -Encoding ascii

      - name: Verify checksums (Unix)
        if: runner.os != 'Windows'
        run: ./scripts/verify-release.sh .

      - name: Verify checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Filter *.sha256 | ForEach-Object {
            $line = Get-Content $_.FullName
            $fields = $line -split '\s+'
            $actual = (Get-FileHash $fields[1] -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $fields[0]) { throw "checksum mismatch: $($fields[1])" }
          }

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: cvx-${{ matrix.os }}
          path: |
            cvx-*.tar.gz
            cvx-*.tar.gz.sha256
            cvx-*.zip
            cvx-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          }

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: cvx-sbom.spdx.json
          upload-artifact: false

      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Verify downloaded checksums
        run: |
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done

      - name: Import release signing key
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        if: env.SIGNING_KEY != ''
        run: |
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys --with-colons | grep '^sec:' >/dev/null

      - name: Sign release assets
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        if: env.SIGNING_KEY != ''
        run: |
          for archive in cvx-*.tar.gz cvx-*.zip; do
            [ -f "$archive" ] || continue
            gpg --batch --yes --armor --detach-sign "$archive"
          done

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            cvx-*.tar.gz
            cvx-*.tar.gz.sha256
            cvx-*.tar.gz.asc
            cvx-*.zip
            cvx-*.zip.sha256
            cvx-*.zip.asc
            cvx-sbom.spdx.json
