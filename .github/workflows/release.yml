name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux keychain dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Configure reproducible build
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked -p cvx-cli

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          archive="cvx-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          tar -czf "$archive" -C target/release cvx
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "cvx-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
          Compress-Archive -Path target/release/cvx.exe -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File "$archive.sha256" -Encoding ascii

      - name: Verify checksums (Unix)
        if: runner.os != 'Windows'
        run: ./scripts/verify-release.sh .

      - name: Verify checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Filter *.sha256 | ForEach-Object {
            $line = Get-Content $_.FullName
            $fields = $line -split '\s+'
            $actual = (Get-FileHash $fields[1] -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $fields[0]) { throw "checksum mismatch: $($fields[1])" }
          }

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: cvx-${{ matrix.os }}
          path: |
            cvx-*.tar.gz
            cvx-*.tar.gz.sha256
            cvx-*.zip
            cvx-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Verify downloaded checksums
        run: |
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done

      - name: Import release signing key
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        if: env.SIGNING_KEY != ''
        run: |
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys --with-colons | grep '^sec:' >/dev/null

      - name: Sign release assets
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        if: env.SIGNING_KEY != ''
        run: |
          for archive in cvx-*.tar.gz cvx-*.zip; do
            [ -f "$archive" ] || continue
            gpg --batch --yes --armor --detach-sign "$archive"
          done

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            cvx-*.tar.gz
            cvx-*.tar.gz.sha256
            cvx-*.tar.gz.asc
            cvx-*.zip
            cvx-*.zip.sha256
            cvx-*.zip.asc
